
name: Secure Windows RDP

on:
  workflow_dispatch

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP securely
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          # Enable Remote Desktop.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          # Keep Network Level Authentication enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Replace the previous firewall rule.
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          # Allow RDP only from the Tailscale address range.
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          if ($LASTEXITCODE -ne 0) {
            throw "Failed to configure the RDP firewall rule."
          }

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:RDP_PASSWORD)) {
            throw "Configure the RDP_PASSWORD repository secret first."
          }

          $securePass = ConvertTo-SecureString `
            $env:RDP_PASSWORD -AsPlainText -Force

          # Remove the existing local user if present.
          $existingUser = Get-LocalUser `
            -Name "RDP" -ErrorAction SilentlyContinue

          if ($existingUser) {
            Remove-LocalUser -Name "RDP"
          }

          # Create the RDP account.
          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires:$false

          # Grant standard RDP access, not administrator access.
          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP"

          "RDP_USER=RDP" >> $env:GITHUB_ENV

          # Do not print the password in workflow logs.
          Write-Host "RDP user configured."

      - name: Connect this runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {
            $candidate = (
              & "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null |
              Select-Object -First 1
            )

            if ($candidate -and $candidate.Trim() -match '^100\.') {
              $tsIP = $candidate.Trim()
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            throw "Tailscale IPv4 address was not assigned."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IPv4 address assigned."

      - name: Verify RDP connectivity
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"

          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -InformationLevel Detailed

          if (-not $testResult.TcpTestSucceeded) {
            throw "TCP connectivity to RDP port 3389 failed."
          }

          Write-Host "RDP TCP connectivity successful."

      - name: Show connection information
        shell: powershell
        run: |
          Write-Host "RDP workflow configuration completed."
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: Use your configured repository secret."
          Write-Host "Do not publish credentials in logs."

      - name: Keep RDP session alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] Workflow is running."
            Start-Sleep -Seconds 300
          }
