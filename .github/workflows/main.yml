name: Secure Windows RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Configure RDP securely
        shell: powershell
        run: |
          # Enable Remote Desktop.
          # Keep Network Level Authentication (NLA) and the normal RDP
          # security layer enabled.
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name 'fDenyTSConnections' `
            -Value 0 `
            -Force

          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name 'UserAuthentication' `
            -Value 1 `
            -Force

          # Remove the old custom rule if it exists.
          netsh advfirewall firewall delete rule name="RDP-Tailscale" 2>$null

          # Allow RDP only from the Tailscale CGNAT address range.
          # This avoids exposing TCP/3389 to arbitrary Internet sources.
          netsh advfirewall firewall add rule `
            name="RDP-Tailscale" `
            dir=in `
            action=allow `
            protocol=TCP `
            localport=3389 `
            remoteip=100.64.0.0/10

          Restart-Service -Name TermService -Force

      - name: Create RDP user
        shell: powershell
        run: |
          $charSet = @{
            Upper   = [char[]](65..90)
            Lower   = [char[]](97..122)
            Number  = [char[]](48..57)
            Special = ([char[]](33..47) + [char[]](58..64) +
                       [char[]](91..96) + [char[]](123..126))
          }

          $rawPassword = @()
          $rawPassword += $charSet.Upper | Get-Random -Count 4
          $rawPassword += $charSet.Lower | Get-Random -Count 4
          $rawPassword += $charSet.Number | Get-Random -Count 4
          $rawPassword += $charSet.Special | Get-Random -Count 4

          $password = -join ($rawPassword | Sort-Object { Get-Random })
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force

          # Fresh GitHub-hosted runners normally do not contain this user.
          if (Get-LocalUser -Name "RDP" -ErrorAction SilentlyContinue) {
            Remove-LocalUser -Name "RDP"
          }

          New-LocalUser `
            -Name "RDP" `
            -Password $securePass `
            -AccountNeverExpires `
            -PasswordNeverExpires:$false

          # Remote Desktop Users is sufficient for RDP access.
          # Do not grant local Administrator privileges unless you actually need them.
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"

          "RDP_USER=RDP" >> $env:GITHUB_ENV
          "RDP_PASSWORD=$password" >> $env:GITHUB_ENV

      - name: Connect this runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Get Tailscale IP
        shell: powershell
        run: |
          $tsIP = $null

          for ($i = 1; $i -le 20; $i++) {
            $candidate = (& "$env:ProgramFiles\Tailscale\tailscale.exe" ip -4 2>$null | Select-Object -First 1)

            if ($candidate -and $candidate -match '^100\.') {
              $tsIP = $candidate.Trim()
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP) {
            Write-Error "Tailscale IPv4 address was not assigned."
            exit 1
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV
          Write-Host "Tailscale IPv4: $tsIP"

      - name: Verify RDP accessibility
        shell: powershell
        run: |
          $testResult = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -InformationLevel Detailed

          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connectivity to RDP port 3389 failed."
            exit 1
          }

          Write-Host "RDP TCP connectivity successful."

      - name: Show RDP access details
        shell: powershell
        run: |
          Write-Host ""
          Write-Host "========== RDP ACCESS =========="
          Write-Host "Address : $env:TAILSCALE_IP"
          Write-Host "Username: $env:RDP_USER"
          Write-Host "Password: $env:RDP_PASSWORD"
          Write-Host "================================"
          Write-Host ""

      - name: Keep RDP session alive
        shell: powershell
        run: |
          while ($true) {
            Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] RDP is active."
            Start-Sleep -Seconds 300
          }
